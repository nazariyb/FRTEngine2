; Engine defaults. Tracked in version control, never written to at runtime.
;
; Layers, weakest to strongest - a key set in a later one wins:
;
;   Core/Config/Engine.ini      this file, shipped defaults
;   <project>/Config/Game.ini   per-project overrides, tracked
;   Local/UserSettings.ini      written by the running game, gitignored
;
; A key absent from every layer keeps the default compiled into the struct, so nothing
; here is required. Deleting a line changes nothing except where the value comes from.
;
; Comments must be whole-line (';' or '#'). Values may contain ';' and '#' freely.
; Enums are written by name and matched case-insensitively.

[Settings.Display]
MonitorIndex=0
Resolution=1920x1080
RefreshRate=60

; Fullscreen | Windowed | Borderless
; Minimized is also a valid name but is rewritten to Windowed on load - see UserSettings.cpp.
FullscreenMode=Windowed

; Raster | Raytracing | Hybrid
RenderMode=Raster

VSync=true
