; Engine defaults. Tracked in version control, never written to at runtime.
;
; Layers, weakest to strongest - a key set in a later one wins:
;
;   Core/Config/Engine.ini              this file, shipped defaults
;   <project>/Config/Game.ini           per-project overrides, tracked
;   <project>/Local/UserSettings.ini    written by the running game, untracked
;
; A key absent from every layer keeps the default compiled into the struct, so nothing
; here is required. Deleting a line changes nothing except where the value comes from.
;
; Comments must be whole-line (';' or '#'). Values may contain ';' and '#' freely.
; Enums are written by name and matched case-insensitively.

[Settings.Display]
MonitorIndex=0
Resolution=1920x1080
RefreshRate=60

; Fullscreen | Windowed | Borderless
; Minimized is also a valid name but is rewritten to Windowed on load - see UserSettings.cpp.
FullscreenMode=Windowed

; Raster | Raytracing | Hybrid
RenderMode=Raster

VSync=true

; The asset editor's timing knobs and the per-user VCS choices (the meta lifecycle, the file watcher).
; WaitForVcs and VcsProvider are meant to be set per user, in Local/UserSettings.ini.
[AssetsEditor]
; A new file waits this long for its meta before the owner creates one.
MetaCreationDelayMs=1500
RemoveGraceMs=1000
; Quiet time after the VCS provider stops reporting busy, before any automatic repair.
VcsSettleMs=1500
; 1: hold automatic repairs while the VCS provider reports busy.
WaitForVcs=1
; Pairing an orphan meta with a new file by content happens only within this window.
OrphanPairWindowMs=5000
; Auto | None | Git
VcsProvider=Auto
