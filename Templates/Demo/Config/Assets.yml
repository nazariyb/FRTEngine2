# Asset pipeline rules for this project's /Project mount (design §3.5), layered over the engine's
# Core/Config/Assets.yml. Hand-written and tracked: FRT reads this file and never rewrites it.
# "FRT.bat assets explain <file>" shows where every effective setting of a file comes from, and
# "FRT.bat assets list-rules" lists every rule file the project sees. Any folder under Content/ may add
# its own Assets.yml for its subtree.
FormatVersion: 1

Scan:
  Quiet:                                  # known non-assets: no "unclaimed file" note
    - "license.txt"                       # the Skull model's attribution
