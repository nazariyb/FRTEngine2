; Editor input: key bindings and viewport camera settings.
;
; These are the shipped defaults, and every binding is listed here. To change one, put the same
; section and key in <engine>/Local/Editor/EditorInput.ini - this checkout's Local/, not a
; project's - with your value, only the keys you change. The editor re-reads both files while it
; runs, and lists anything it cannot read in its toolbar and log.
;
; A binding is one or more key chords, separated by commas. A chord is modifiers then a key,
; joined with '+': Ctrl+Shift+P, F11, Shift+Space. Modifiers: Ctrl, Alt, Shift, Super.
; An empty value (or None) unbinds.
;
; Key names (case does not matter): A-Z, 0-9, F1-F12, Up, Down, Left, Right, PageUp, PageDown,
; Home, End, Insert, Delete, Space, Enter, Escape, Tab, Backspace, Numpad0-Numpad9, NumpadPlus,
; NumpadMinus, NumpadMultiply, NumpadDivide, NumpadDecimal, NumpadEnter, Grave, Minus, Equals,
; LeftBracket, RightBracket, Backslash, Semicolon, Apostrophe, Comma, Period, Slash, Pause
; (all: Core/Source/Input/InputTypes.h). Shift, Ctrl, Alt and Super are modifiers only.
; Keys are positional: W means the key left of E, whatever the keyboard layout prints on it.

; Editor commands. A chord runs its command when pressed with exactly these modifiers held.
; They are ignored while a text field is being edited and while the Scene camera is being dragged.
[Commands]
Play=
Stop=
TogglePlay=Ctrl+P
TogglePause=Ctrl+Shift+P
Step=Ctrl+Alt+P
; The viewport under the cursor, else the one last used.
ToggleMaximize=Shift+Space
ToggleFullscreen=F11
ExitFullscreen=Escape
ToggleRenderMode=F2
ResetLayout=
Exit=

; Scene view camera, as in Unreal Engine. The mouse controls are fixed:
;   RMB drag            look around (and the flight keys below move)
;   LMB drag            move along the ground and turn
;   LMB+RMB drag        pan sideways and up/down
;   MMB drag            pan along the view
;   Wheel               move forward/back; during a drag it changes the camera speed
;   Alt + LMB/RMB/MMB   orbit / dolly / track around the point ahead
; Navigation keys take no modifiers, and any held modifier pauses them.

; Flight keys: only while a mouse button drags in the Scene view (Unreal's WASD_RMBOnly).
[FlightKeys]
Forward=W
Backward=S
Left=A
Right=D
WorldUp=E
WorldDown=Q
LocalUp=R
LocalDown=F
FovZoomOut=Z
FovZoomIn=C

; Keyboard keys: whenever the Scene view has keyboard focus, no mouse button needed.
[KeyboardKeys]
Forward=Up, Numpad8
Backward=Down, Numpad2
Left=Left, Numpad4
Right=Right, Numpad6
WorldUp=PageUp, Numpad9, NumpadPlus
WorldDown=PageDown, Numpad7, NumpadMinus
LocalUp=
LocalDown=
FovZoomOut=Numpad1
FovZoomIn=Numpad3

; Unreal's viewport settings and defaults.
[ViewportCamera]
; Camera speed at start-up; the Scene view's toolbar and the wheel during a drag change it.
; 1 flies at about 20 m/s and drags 1 cm per mouse count. Range 0.0001-10000.
Speed=1
; Degrees per mouse count, for looking, LMB turning and orbiting. Range 0.01-1.
MouseSensitivity=0.2
; Metres per wheel notch, whatever the speed.
WheelDollyDistance=0.96
InvertMouseLookY=false
InvertOrbitY=false
InvertMiddleMousePan=false
InvertRightMouseDollyY=false
